<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Dashboard - SkyVoyage</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        .passenger-dashboard {
            min-height: 100vh;
            background: var(--color-gray-50);
        }
        
        .dashboard-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--color-white);
            padding: var(--spacing-3xl) 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-welcome {
            display: flex;
            align-items: center;
            gap: var(--spacing-xl);
        }
        
        .user-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--color-white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-4xl);
            font-weight: 800;
            color: var(--primary-color);
            box-shadow: var(--shadow-2xl);
        }
        
        .user-avatar-large img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .welcome-text h1 {
            font-family: var(--font-display);
            font-size: var(--text-4xl);
            margin-bottom: var(--spacing-sm);
        }
        
        .user-contact {
            display: flex;
            gap: var(--spacing-xl);
            margin-top: var(--spacing-md);
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .quick-actions {
            display: flex;
            gap: var(--spacing-md);
        }
        
        .dashboard-nav {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-gray-200);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-tabs {
            display: flex;
            gap: var(--spacing-md);
            padding: var(--spacing-md) 0;
        }
        
        .nav-tab {
            padding: var(--spacing-md) var(--spacing-xl);
            background: none;
            border: none;
            font-weight: 600;
            color: var(--color-gray-600);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: var(--transition-base);
        }
        
        .nav-tab:hover {
            color: var(--primary-color);
        }
        
        .nav-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        
        .dashboard-content {
            padding: var(--spacing-2xl) 0;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .flights-grid {
            display: grid;
            gap: var(--spacing-lg);
        }
        
        .flight-booking-card {
            background: var(--color-white);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
            transition: var(--transition-base);
        }
        
        .flight-booking-card:hover {
            box-shadow: var(--shadow-xl);
        }
        
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-lg);
        }
        
        .booking-info {
            flex: 1;
        }
        
        .booking-ref {
            font-size: var(--text-sm);
            color: var(--color-gray-600);
            margin-bottom: var(--spacing-xs);
        }
        
        .flight-route-large {
            display: flex;
            align-items: center;
            gap: var(--spacing-xl);
            margin: var(--spacing-lg) 0;
        }
        
        .route-point {
            text-align: center;
        }
        
        .airport-code {
            font-size: var(--text-3xl);
            font-weight: 800;
            color: var(--color-gray-900);
        }
        
        .city-name {
            font-size: var(--text-sm);
            color: var(--color-gray-600);
            margin-top: var(--spacing-xs);
        }
        
        .route-timeline {
            flex: 1;
            text-align: center;
            position: relative;
        }
        
        .timeline-line {
            height: 2px;
            background: var(--color-gray-300);
            position: relative;
            margin: var(--spacing-md) 0;
        }
        
        .timeline-plane {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--primary-color);
            color: var(--color-white);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
            padding: var(--spacing-lg);
            background: var(--color-gray-50);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
        }
        
        .detail-item {
            text-align: center;
        }
        
        .detail-label {
            font-size: var(--text-xs);
            color: var(--color-gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--spacing-xs);
        }
        
        .detail-value {
            font-weight: 600;
            color: var(--color-gray-900);
        }
        
        .search-section {
            background: var(--color-white);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-md);
            margin-bottom: var(--spacing-xl);
        }
    </style>
</head>
<body>
    <div class="passenger-dashboard">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="container">
                <div class="header-content">
                    <div class="user-welcome">
                        <div class="user-avatar-large" id="userAvatar">
                            JD
                        </div>
                        <div class="welcome-text">
                            <h1>Welcome back, <span id="userName">John Doe</span>!</h1>
                            <div class="user-contact">
                                <div class="contact-item">
                                    <i class="fas fa-envelope"></i>
                                    <span id="userEmail">john.doe@example.com</span>
                                </div>
                                <div class="contact-item">
                                    <i class="fas fa-phone"></i>
                                    <span id="userPhone">+1 (555) 123-4567</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="quick-actions">
                        <button class="btn btn-cta" onclick="window.location.href='passenger-profile.html'">
                            <i class="fas fa-user"></i> Profile
                        </button>
                        <button class="btn btn-secondary" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="dashboard-nav">
            <div class="container">
                <div class="nav-tabs">
                    <button class="nav-tab active" onclick="showTab('search')">
                        <i class="fas fa-search"></i> Search Flights
                    </button>
                    <button class="nav-tab" onclick="showTab('current')">
                        <i class="fas fa-plane-departure"></i> Current Flights
                    </button>
                    <button class="nav-tab" onclick="showTab('completed')">
                        <i class="fas fa-check-circle"></i> Completed Flights
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Content -->
        <div class="dashboard-content">
            <div class="container">
                <!-- Search Flight Tab -->
                <div id="searchTab" class="tab-content active">
                    <div class="search-section">
                        <h2 style="margin-bottom: var(--spacing-xl); color: var(--color-gray-900);">
                            <i class="fas fa-search"></i> Search for Flights
                        </h2>
                        
                        <form id="passengerSearchForm">
                            <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-bottom: var(--spacing-lg);">
                                <div class="form-group">
                                    <label><i class="fas fa-plane-departure"></i> From</label>
                                    <select id="searchFrom" required>
                                        <option value="">Select origin</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label><i class="fas fa-plane-arrival"></i> To</label>
                                    <select id="searchTo" required>
                                        <option value="">Select destination</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-search">
                                <i class="fas fa-search"></i> Search Flights
                            </button>
                        </form>
                    </div>
                    
                    <!-- Available Flights List -->
                    <div id="availableFlightsList" style="display: none;">
                        <h3 style="margin-bottom: var(--spacing-lg); color: var(--color-gray-900);">
                            Available Flights
                        </h3>
                        <div class="flights-grid" id="availableFlightsGrid">
                            <!-- Available flights will be loaded here -->
                        </div>
                    </div>
                </div>
                
                <!-- Current Flights Tab -->
                <div id="currentTab" class="tab-content">
                    <h2 style="margin-bottom: var(--spacing-xl); color: var(--color-gray-900);">
                        <i class="fas fa-plane-departure"></i> Current Flights
                    </h2>
                    <div class="flights-grid" id="currentFlightsList">
                        <!-- Current flights will be loaded here -->
                    </div>
                </div>
                
                <!-- Completed Flights Tab -->
                <div id="completedTab" class="tab-content">
                    <h2 style="margin-bottom: var(--spacing-xl); color: var(--color-gray-900);">
                        <i class="fas fa-check-circle"></i> Completed Flights
                    </h2>
                    <div class="flights-grid" id="completedFlightsList">
                        <!-- Completed flights will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Tab switching
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }
        
        // Load user data
        function loadUserData() {
            const userData = getUserData();
            if (userData) {
                document.getElementById('userName').textContent = `${userData.first_name} ${userData.last_name}`;
                document.getElementById('userEmail').textContent = userData.email;
                document.getElementById('userPhone').textContent = userData.phone || 'N/A';
                
                const initials = `${userData.first_name.charAt(0)}${userData.last_name.charAt(0)}`.toUpperCase();
                document.getElementById('userAvatar').textContent = initials;
            }
        }
        
        // Search form
        document.getElementById('passengerSearchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const from = document.getElementById('searchFrom').value;
            const to = document.getElementById('searchTo').value;
            
            if (!from || !to) {
                alert('Please select both origin and destination');
                return;
            }
            
            if (from === to) {
                alert('Origin and destination cannot be the same');
                return;
            }
            
            try {
                const response = await FlightsAPI.search({
                    origin_airport_id: from,
                    destination_airport_id: to
                });
                
                if (response.success && response.data.length > 0) {
                    displayAvailableFlights(response.data);
                    document.getElementById('availableFlightsList').style.display = 'block';
                } else {
                    alert('No flights found for this route');
                }
            } catch (error) {
                console.error('Error searching flights:', error);
                alert('Error searching flights');
            }
        });
        
        function displayAvailableFlights(flights) {
            const grid = document.getElementById('availableFlightsGrid');
            grid.innerHTML = flights.map(flight => createFlightCard(flight, 'available')).join('');
        }
        
        function createFlightCard(flight, type) {
            return `
                <div class="flight-booking-card" onclick="viewFlightInfo(${flight.flight_id})">
                    <div class="booking-header">
                        <div class="booking-info">
                            <div class="booking-ref">Flight ${flight.flight_number}</div>
                            <span class="status-badge ${type === 'completed' ? 'completed' : 'active'}">
                                ${type === 'completed' ? 'Completed' : 'Available'}
                            </span>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: var(--text-2xl); font-weight: 800; color: var(--primary-color);">
                                ${formatCurrency(flight.base_price)}
                            </div>
                            <div style="font-size: var(--text-sm); color: var(--color-gray-600);">per passenger</div>
                        </div>
                    </div>
                    
                    <div class="flight-route-large">
                        <div class="route-point">
                            <div class="airport-code">${flight.origin_code || 'XXX'}</div>
                            <div class="city-name">${flight.origin_city || 'Origin'}</div>
                            <div style="font-size: var(--text-sm); margin-top: var(--spacing-xs);">
                                ${formatTime(flight.departure_time)}
                            </div>
                        </div>
                        
                        <div class="route-timeline">
                            <div style="font-size: var(--text-sm); color: var(--color-gray-600);">
                                ${calculateDuration(flight.departure_time, flight.arrival_time)}
                            </div>
                            <div class="timeline-line">
                                <div class="timeline-plane">
                                    <i class="fas fa-plane"></i>
                                </div>
                            </div>
                            <div style="font-size: var(--text-xs); color: var(--color-gray-500);">Non-stop</div>
                        </div>
                        
                        <div class="route-point">
                            <div class="airport-code">${flight.destination_code || 'XXX'}</div>
                            <div class="city-name">${flight.destination_city || 'Destination'}</div>
                            <div style="font-size: var(--text-sm); margin-top: var(--spacing-xs);">
                                ${formatTime(flight.arrival_time)}
                            </div>
                        </div>
                    </div>
                    
                    <div class="booking-details">
                        <div class="detail-item">
                            <div class="detail-label">Date</div>
                            <div class="detail-value">${formatDate(flight.departure_time)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Aircraft</div>
                            <div class="detail-value">${flight.aircraft_model || 'N/A'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Seats Available</div>
                            <div class="detail-value">${flight.available_seats}</div>
                        </div>
                    </div>
                    
                    ${type === 'available' ? `
                        <button class="btn btn-primary" style="width: 100%;" onclick="event.stopPropagation(); bookFlight(${flight.flight_id})">
                            <i class="fas fa-ticket-alt"></i> Book Now
                        </button>
                    ` : ''}
                </div>
            `;
        }
        
        function viewFlightInfo(flightId) {
            window.location.href = `flight-info.html?id=${flightId}`;
        }
        
        function bookFlight(flightId) {
            sessionStorage.setItem('selectedFlightId', flightId);
            window.location.href = 'booking.html';
        }
        
        function logout() {
            clearAuthData();
            window.location.href = 'index.html';
        }
        
        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            populateAirportSelects();
            
            // Load sample current flights
            const sampleCurrent = [
                { flight_id: 1, flight_number: 'SV101', origin_code: 'JFK', origin_city: 'New York', destination_code: 'LAX', destination_city: 'Los Angeles', departure_time: '2025-12-20T10:00:00', arrival_time: '2025-12-20T14:30:00', base_price: 299, available_seats: 45 }
            ];
            document.getElementById('currentFlightsList').innerHTML = sampleCurrent.map(f => createFlightCard(f, 'current')).join('');
            
            // Load sample completed flights
            const sampleCompleted = [
                { flight_id: 2, flight_number: 'SV202', origin_code: 'LAX', origin_city: 'Los Angeles', destination_code: 'JFK', destination_city: 'New York', departure_time: '2025-11-15T08:00:00', arrival_time: '2025-11-15T16:30:00', base_price: 349, available_seats: 0 }
            ];
            document.getElementById('completedFlightsList').innerHTML = sampleCompleted.map(f => createFlightCard(f, 'completed')).join('');
        });
        
        // Populate airport dropdowns
        async function populateAirportSelects() {
            try {
                const response = await AirportsAPI.getAll();
                if (response.success) {
                    const fromSelect = document.getElementById('searchFrom');
                    const toSelect = document.getElementById('searchTo');
                    
                    response.data.forEach(airport => {
                        const option1 = document.createElement('option');
                        option1.value = airport.airport_id;
                        option1.textContent = `${airport.city} (${airport.iata_code})`;
                        fromSelect.appendChild(option1);
                        
                        const option2 = document.createElement('option');
                        option2.value = airport.airport_id;
                        option2.textContent = `${airport.city} (${airport.iata_code})`;
                        toSelect.appendChild(option2);
                    });
                }
            } catch (error) {
                console.error('Error loading airports:', error);
            }
        }
    </script>
</body>
</html>
